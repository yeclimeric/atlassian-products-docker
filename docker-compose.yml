version: '3'

networks:
    1panel-network:
        external: true

services:
  jira:
    container_name: jira
    build:
      context: .
      dockerfile: Jira.Dockerfile
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./jira/conf/server.xml:/opt/atlassian/jira/conf/server.xml
      - ./jira/atlassian:/var/atlassian/jira
    ports:
      - "18080:8080"
    networks:
      - 1panel-network
    restart: always
