version: '3'
services:
  mysql:
    image: mysql:5.7
    container_name: bg-db
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_LOG_CONSOLE=true
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=jira
      - MYSQL_USER=jira
      - MYSQL_PASSWORD=123456
    command: ['mysqld', '--character-set-server=utf8', '--collation-server=utf8_bin', '--lower_case_table_names=1']
    volumes:
      - ./mysql/data:/var/lib/mysql
    ports: 
      - 13306:3306
    networks: 
      vpn:
        ipv4_address: 172.168.88.2
    restart: always


  jira:
    container_name: bg-jira
    build:
      context: .
      dockerfile: Jira.Dockerfile
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./jira/conf/server.xml:/opt/atlassian/jira/conf/server.xml
      - ./jira/atlassian:/var/atlassian/jira
    ports:
      - "18080:8080"
    networks: 
      vpn:
        ipv4_address: 172.168.88.3
    restart: always


networks:
  vpn:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet:  172.168.88.0/24
          gateway: 172.168.88.1
